name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Descargar Dependencias y Generar go.sum
        run: |
          go mod tidy

      - name: Instalar Herramienta de Metadatos (goversioninfo v1.4.0)
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0

      - name: Generar Recursos de Manifiesto (.syso)
        shell: pwsh
        run: |
          cd cmd/sophosquick
          goversioninfo
          cd ../..

      - name: Compilar Binario para Windows
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        shell: pwsh
        run: |
          $Tag = $env:REF_NAME
          if (-not $Tag -or $Tag -eq "main") {
            $Tag = $env:INPUT_VERSION
          }
          if (-not $Tag) { $Tag = "v1.0.0" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # Compilar binario nativo de Windows optimizado
          go build -ldflags="-H=windowsgui -s -w -X 'main.Version=$Tag'" -o dist/quickconnect.exe ./cmd/sophosquick

      - name: Generar Paquetes ZIP y Checksums SHA-256
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path quickconnect.exe, ..\README.md, ..\LICENSE -DestinationPath quickconnect-windows-amd64.zip -Force

          $HashExe = (Get-FileHash -Path quickconnect.exe -Algorithm SHA256).Hash
          $HashZip = (Get-FileHash -Path quickconnect-windows-amd64.zip -Algorithm SHA256).Hash
          "$HashExe  quickconnect.exe" | Out-File -Encoding ascii -FilePath quickconnect.exe.sha256
          "$HashZip  quickconnect-windows-amd64.zip" | Out-File -Encoding ascii -FilePath quickconnect-windows-amd64.zip.sha256
          cd ..

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "QuickConnect for Sophos VPN ${{ github.ref_name || github.event.inputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/quickconnect.exe
            dist/quickconnect-windows-amd64.zip
            dist/quickconnect.exe.sha256
            dist/quickconnect-windows-amd64.zip.sha256
